 পদ`},nameEn:`Zamindari Daab Chingri (Jumbo Prawns in Tender Coconut)`,nameBn:`জমিদারি ডাব চিংড়ি`,description:{en:`Freshwater golda prawns simmered in tender coconut water, delicate mustard cream, and sweet malai, sealed inside a green coconut shell and slow-baked in our kitchen. (Demo Special)`,bn:`কচি ডাবের শাঁস, ডাবের জল ও হালকা সর্ষে-মালাই বাটায় মাখানো গলদা চিংড়ি—ডাবের ভেতরে মুখ বন্ধ করে ধীমে আঁচে দমে রান্না। (ডেমো বিশেষ পদ)`},demoPrice:790,servingInfo:{en:`Serves 1–2 · Accompanied by steamed Gobindobhog rice · Demo Price`,bn:`১–২ জনের জন্য উপযুক্ত · সাথে গরম গোবিন্দভোগ ভাত · ডেমো মূল্য`},image:Ie,menuItemId:`fish-daab-chingri`},storyContent:{headingEn:`A Story. A Flavour.`,headingBn:`একটি গল্প, এক স্বাদ`,kickerEn:`Our Fictional Culinary Inspiration · Demo Concept`,kickerBn:`আমাদের রন্ধন ভাবনা · ডেমো সংস্করণ`,leadParagraph:{en:`Conceived as a tribute to Kolkata’s timeless dining rooms, Bengal Heritage (আহারে কলকাতা) celebrates the quiet poetry of Bengali home and courtyard kitchens—where recipes are measured not by timers, but by the aroma of tempered radhuni, roasted panch phoron, and golden mustard oil.`,bn:`কলকাতার চিরন্তন ভোজনরসিক ঐতিহ্যকে সম্মান জানিয়ে "আহারে কলকাতা" (Bengal Heritage)-এর ভাবনা। বাঙালির রান্নাঘরের সেই চিরচেনা ঘ্রাণ—যেখানে সময়ের চেয়ে পাঁচফোড়ন, রাঁধুনি আর খাঁটি সর্ষের তেলের সুবাসেই রান্নার পূর্ণতা মাপা হয়।`},secondParagraph:{en:`From the first crisp bite of warm Luchi and Begun Bhaja to the velvety finish of earthen-pot Mishti Doi, our demo concept pairs ancestral cooking techniques with warm, contemporary hospitality in the heart of Kolkata.`,bn:`গরম ফুলকো লুচি ও বেগুন ভাজা থেকে শুরু করে মাটির ভাঁড়ের মিষ্টি দই—আমাদের এই ডেমো রেস্তোরাঁয় সাবেকি রন্ধনশৈলীর সাথে আধুনিক আতিথেয়তার এক অনন্য মেলবন্ধন ঘটানো হয়েছে।`},demoDisclaimer:{en:`Note: This story is fictional and created for website demonstration purposes to illustrate editorial storytelling for restaurant owners.`,bn:`দ্রষ্টব্য: এই বিবরণটি কাল্পনিক এবং শুধুমাত্র রেস্তোরাঁর ওয়েবসাইট ডেমো প্রদর্শনের উদ্দেশ্যে রচিত।`},primaryImage:Pe,secondaryImage:Fe,timeline:[{stage:`01`,titleEn:`Kolkata`,titleBn:`কলকাতা`,descEn:`Inspired by the architectural warmth of North and Central Kolkata courtyard houses and afternoon adda.`,descBn:`উত্তর ও মধ্য কলকাতার সাবেকি ঠাকুরদালান এবং আন্তরিক আড্ডার আবহ থেকে অনুপ্রাণিত।`},{stage:`02`,titleEn:`Family Recipes`,titleBn:`পারিবারিক রন্ধনপ্রণালী`,descEn:`Honouring slow-cooked heirloom techniques passed across generations of Bengali home kitchens.`,descBn:`প্রজন্মের পর প্রজন্ম ধরে চলে আসা বাঙালি বাড়ির ধীমে আঁচে রান্নার ঘরোয়া কৌশল।`},{stage:`03`,titleEn:`Bengali Cuisine`,titleBn:`বাঙালি রসনাবিলাস`,descEn:`A delicate progression from bitter (Shukto) to tangy, spiced gravies, and artisanal milk sweets.`,descBn:`শুক্তোর তিতো থেকে শুরু করে সর্ষে-পোস্ত, কষা মাংস এবং শেষে মিষ্টির এক পরিপূর্ণ ভোজের ক্রম।`},{stage:`04`,titleEn:`Modern Dining`,titleBn:`আধুনিক আতিথেয়তা`,descEn:`Presented on handcrafted Kansa bronze tableware with attentive, unhurried fine-dining service.`,descBn:`হাতে তৈরি কাঁসার বাসনে পরিবেশন এবং আধুনিক ও আন্তরিক আতিথেয়তার অভিজ্ঞতা।`}]},soulOfBengal:[{id:`soul-fish`,titleBn:`মাছ`,titleEn:`Fish`,transliteration:`Maach · River & Estuary Bounty`,description:{en:`From prized monsoon Hilsa (Ilish) to sweet-water Rohu, Bhetki, and Golda Chingri, river fish lies at the heart of Kolkata’s culinary identity.`,bn:`বর্ষার রুপোলি ইলিশ থেকে শুরু করে রুই, কাতলা, ভেটকি ও গলদা চিংড়ি—নদীমাতৃক বাংলার আত্মার সাথে জড়িয়ে আছে মাছের স্বাদ।`},culinaryDetail:{en:`Poached in mustard, steamed in banana leaf (Paturi), or simmered in light cumin broth.`,bn:`সর্ষে বাটা, কলাপাতায় পাতুরি কিংবা জিরে-আদা বাটার হালকা ঝোল।`},image:Ie},{id:`soul-spices`,titleBn:`মশলা`,titleEn:`Spices`,transliteration:`Moshla · Delicate Aromatics`,description:{en:`Guided by Panch Phoron (five-seed tempering), nutty poppy seeds (Posto), pungent yellow & black mustard, and aromatic Gondhoraj lime.`,bn:`পাঁচফোড়নের ফোড়ন, পোস্ত বাটা, কালো ও সাদা সর্ষের ঝাঁঝ এবং গন্ধরাজ লেবুর সতেজ সুবাসে অনন্য বাঙালি রান্না।`},culinaryDetail:{en:`Freshly ground on stone (Shil-Nora) to preserve volatile oils and subtle warmth.`,bn:`শিল-নোড়ায় বাটা টাটকা মশলার স্বাদ ও ঘ্রাণ।`},image:Le},{id:`soul-sweets`,titleBn:`মিষ্টি`,titleEn:`Sweets`,transliteration:`Mishti · Chhena & Nolen Gur Craft`,description:{en:`Kolkata’s legendary confectionary heritage built on delicate fresh cottage cheese (Chhena), smoky winter date-palm jaggery, and slow-reduced milk.`,bn:`টাটকা ছানা, শীতের নলেন গুড় এবং মাটির হাঁড়ির ঘন ক্ষীরের দই নিয়ে কলকাতার বিশ্বজোড়া মিষ্টির ঐতিহ্য।`},culinaryDetail:{en:`Mishti Doi set in unglazed terracotta pots that wick moisture for a rich, creamy texture.`,bn:`মাটির ভাঁড়ে বসানো জমাট বাঁধা লালচে মিষ্টি দই ও নরম পাকের সন্দেশ।`},image:Re},{id:`soul-rice`,titleBn:`ভাত`,titleEn:`Rice`,transliteration:`Bhaat · Fragrant Short-Grain Harvest`,description:{en:`Short-grain heirloom Gobindobhog rice—naturally buttery and aromatic—forms the canvas for golden Basanti Pulao, Bhoger Khichuri, and steamed platters.`,bn:`সুগন্ধি ছোট দানার গোবিন্দভোগ চাল—যার মনমাতানো সুবাসে তৈরি হয় বাসন্তী পোলাও, ভোগের খিচুড়ি ও গরম ভাতের থালি।`},culinaryDetail:{en:`Tossed with clarified cow’s ghee, whole green cardamom, cashews, and golden raisins.`,bn:`খাঁটি গাওয়া ঘি, ছোট এলাচ, কাজু ও কিশমিশের মেলবন্ধন।`},image:Pe}],signatureDishes:[{id:`sig-1`,menuItemId:`fish-shorshe-ilish`,nameBn:`সর্ষে ইলিশ`,nameEn:`Shorshe Ilish`,subtitle:{en:`Monsoon Hilsa in Stone-Ground Mustard · Demo Signature`,bn:`শিলে বাটা সর্ষে ও কাঁচালঙ্কায় ইলিশ · ডেমো সিগনেচার পদ`},description:{en:`Prime cut of bone-in river Hilsa gently poached in an emulsion of yellow and black mustard seeds, green chillies, and cold-pressed pungent mustard oil.`,bn:`কালো ও সাদা সর্ষে বাটা, চেরা কাঁচালঙ্কা এবং খাঁটি কাঁচা সর্ষের তেলের ঝাঁঝালো স্বাদে রান্না করা বাছাই করা ইলিশ মাছের পেটি ও গাদা।`},demoPrice:740,image:Ie,pairingNote:{en:`Traditionally paired with steaming hot Gobindobhog plain rice`,bn:`গরম ধোঁয়া ওঠা
